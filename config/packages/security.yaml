security:
    hide_user_not_found: false

    role_hierarchy:
        ROLE_ADMIN: [ROLE_STUDENT_USER]

    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        App\Entity\User: 'auto'
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: 'auto'
            cost:      15
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
        jwt:
            lexik_jwt: ~
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            # pattern: ^/api/dashboard/
            lazy: true
        # login:
            # user_checker: lexik_jwt_authentication.security.jwt_authenticator
            json_login:
                provider: app_user_provider
            # form_login: ~
                check_path: /api/login_check
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
        # api:
        #     pattern: ^/api/
        #     stateless: true
            provider: app_user_provider
            jwt: ~
                # authenticator: app.custom_authenticator
        api_token_refresh:
            provider: jwt
            pattern: ^/api/token/refresh
            stateless: true
            # user_checker: user_checker_service_id
            refresh_jwt: ~
            # custom_authenticator: App\Security\ApiKeyAuthenticator

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true
        

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/products, roles: PUBLIC_ACCESS }
        - { path: ^/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/login, roles: PUBLIC_ACCESS }
        # - { path: ^/webhook/MollieDirectPayment, roles: PUBLIC_ACCESS }
        - { path: ^/api/webhook/MollieDirectPayment, roles: PUBLIC_ACCESS }
        - { path: ^/api/webhook/MollieSubscriptionPayment, roles: PUBLIC_ACCESS }
        - { path: ^/api/(login|token/refresh), roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/dashboard, roles: ROLE_USER_STUDENT }
        - { path: ^/api/v1/payment, roles: ROLE_USER_STUDENT }
        - { path: ^/api/v1/order/address, roles: ROLE_USER_STUDENT }
        - { path: ^/api/v1/order/payment, roles: ROLE_USER_STUDENT }
        - { path: ^/api/v1/order/create, roles: ROLE_USER_STUDENT }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
