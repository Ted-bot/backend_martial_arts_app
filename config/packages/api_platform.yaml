    #     stateless: true
    #     cache_headers:
    #         vary: ['Content-Type', 'X-Authorization', 'Origin']
    #     extra_properties:
    #         standard_put: false
    #         rfc_7807_compliant_errors: true
    # keep_legacy_inflector: false
    use_symfony_listeners: true
    eager_loading:
        enabled: false
        # max_joins: 100
