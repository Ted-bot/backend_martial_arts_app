# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            # - '../src/Entity/'
            - '../src/Kernel.php'
    App\http_kernel\cors_subscriber:
                class: App\EventSubscriber\HttpKernel\CorsSubscriber
                tags:
                    - { name: kernel.event_subscriber }

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    acme_api.encoder.nixilla_jwt_encoder:
        class: App\Encoder\NixillaJWTEncoder
        
    jwt_token_authenticator:
        class: App\Security\ApiKeyAuthenticator
        autowire:  true
    
    CoopTilleuls\ForgotPasswordBundle\Manager\ForgotPasswordManager:
        class: CoopTilleuls\ForgotPasswordBundle\Manager\ForgotPasswordManager
        arguments:
            $passwordTokenManager: '@coop_tilleuls_forgot_password.manager.password_token'
            # $manager: '@coop_tilleuls_forgot_password.manager.doctrine'
            # $userClass: App\Entity\Tuser

    CoopTilleuls\ForgotPasswordBundle\Provider\ProviderChainInterface:
        class: CoopTilleuls\ForgotPasswordBundle\Provider\ProviderChainInterface
    
    coop_tilleuls_forgot_password.controller.update_password:
        class: CoopTilleuls\ForgotPasswordBundle\Controller\UpdatePassword
        tags: ['controller.service_arguments']
        
    # coop_tilleuls_forgot_password.create_token:
    #     class: CoopTilleuls\ForgotPasswordBundle\Event\CreateToken
    #     tags: ['controller.service_arguments']